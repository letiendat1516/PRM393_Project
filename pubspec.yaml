name: jobhub_prm393
description: "JobHub - AI-powered recruitment platform (Flutter port of jobhub web, PRM393)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (teacher requirement)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase (teacher requirement: Auth + FCM + Firestore)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  flutter_local_notifications: ^17.2.3

  # Local persistence (teacher requirement)
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.2.7

  # Immutable models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Files / media
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Charts (AI stats, employer dashboard, CV analysis)
  fl_chart: ^0.69.0
  collection: ^1.18.0
  uuid: ^4.4.0

  # AI (Gemini OpenAI-compatible endpoint) + scroll-reveal animations
  http: ^1.2.2
  visibility_detector: ^0.4.0+2

  # Google Sign-In native SDK — firebase_auth's signInWithProvider uses
  # Chrome Custom Tabs with storage partitioning which breaks the OAuth
  # session on Android. google_sign_in uses Google Play Services natively.
  google_sign_in: ^6.2.1

  # Misc
  intl: ^0.20.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  logger: ^2.4.0
  syncfusion_flutter_pdf: ^35.1.37
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
